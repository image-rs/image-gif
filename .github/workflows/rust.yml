name: Rust CI
on:
  push:
    branches: [ master, "version-0.13" ]
  pull_request:
    branches: [ master, "version-0.13" ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88.0", stable, beta, nightly]
        features: ["", "std", "color_quant"]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy
    - name: build
      run: >
        cargo build --verbose --no-default-features --features "$FEATURES"
    - name: clippy
      run: >
        cargo clippy --verbose --all-targets --no-default-features --features "$FEATURES"
      if: ${{ matrix.rust == 'stable' }}
    - name: test
      run: >
        cargo test --tests --benches --no-default-features --features "$FEATURES"
      if: ${{ matrix.rust != '1.88.0' }}
      env:
        FEATURES: ${{ matrix.features }}
  rustfmt:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Run rustfmt check
      run: cargo fmt -- --check
